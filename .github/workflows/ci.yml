name: BarFlow CI v2

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python - testes e validacao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validar sintaxe Python
        run: python -m compileall -q backend scripts tests
      - name: Executar testes FastAPI e SQLite
        env:
          BARFLOW_DATA_DIR: ${{ runner.temp }}/barflow-ci-data
        run: python -m pytest -q tests/

  frontend:
    name: Frontend - validar JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe JavaScript
        run: |
          node --check Frontend/js/app.js
          node --check Frontend/js/store.js
