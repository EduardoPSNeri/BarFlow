<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BarFlow — Trocar senha provisória</title><link rel="stylesheet" href="css/global.css"><script defer src="js/app.js"></script></head>
<body data-page="alterar-senha"><main class="login-page"><div class="panel formblock login-card"><div class="brandmark" aria-hidden="true">B</div><h1>Definir senha de acesso</h1><p id="password-change-hint" class="sub">Informe a senha atual e defina uma nova com entre 4 e 20 caracteres.</p>
<form id="password-change-form" class="field"><label for="current-password">Senha provisória atual</label><input id="current-password" type="password" autocomplete="current-password" required>
<label for="new-password">Nova senha (4 a 20 caracteres)</label><input id="new-password" type="password" autocomplete="new-password" minlength="4" maxlength="20" required>
<label for="confirm-password">Confirmar nova senha</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="4" maxlength="20" required>
<button class="btn full-width" type="submit">Salvar nova senha</button></form><div id="feedback" class="notice info" role="status" hidden></div></div></main></body></html>
